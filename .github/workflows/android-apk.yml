name: Build Reyo Pack APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build native web bundle and sync Capacitor
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jbyhwmddckyhvmcgjbvf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dxTWUk6dfzinpMQ6Va2SBg_heVZXZ_w
        run: npm run native:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reyo-pack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
